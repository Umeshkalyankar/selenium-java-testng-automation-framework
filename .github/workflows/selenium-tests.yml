name: Selenium Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    env:
      BROWSER: Chrome
      APP_URL: https://app.thetestingacademy.com/playwright/tta-bank/
      APP_EMAIL: ${{ secrets.APP_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      INVALID_EMAIL: wronguser@ttabank.in
      INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}
      SIGNUP_NAME: James Bond
      SIGNUP_MOBILE: "9437454545"
      SIGNUP_PASSWORD: ${{ secrets.SIGNUP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Smoke Tests
        run: mvn clean test -DsuiteXmlFile=testng-smoke.xml

      - name: Upload Test Screenshots and Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: |
            Screenshot/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
